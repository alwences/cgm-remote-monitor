name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode-review:
    # fork guard: fork PRs get no repository secrets, so OPENCODE_API_KEY would
    # be empty and the job would fail. Only review PRs from this repository.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Must persist credentials: the opencode action runs
          # `git fetch origin <head-branch>` to resolve PRs, which needs the
          # GITHUB_TOKEN in git's extraheader. With persist-credentials: false
          # that fetch fails with "could not read Username for
          # 'https://github.com'".
          persist-credentials: true

      - name: Run opencode review
        uses: anomalyco/opencode/github@a0f8dccbfe139ffc7137d1eaf6fee6e4195af599
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
            Post the review as a PR comment.

  opencode:
    # Collaboration guard: the trigger is a comment containing /oc, so once the
    # repo is public any user could queue a job holding pull-requests: write and
    # issues: write. It would fail on an empty OPENCODE_API_KEY (fork and
    # outside-collaborator runs get no secrets) while still burning Actions
    # minutes, so only run it for people with write access. Note
    # author_association is not trustworthy for fork-authored comments, which is
    # why the secret is also empty there.
    if: |
      (github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Must persist credentials: the opencode action runs
          # `git fetch origin <head-branch>` to resolve PRs, which needs the
          # GITHUB_TOKEN in git's extraheader. With persist-credentials: false
          # that fetch fails with "could not read Username for
          # 'https://github.com'".
          persist-credentials: true

      - name: Run opencode
        uses: anomalyco/opencode/github@a0f8dccbfe139ffc7137d1eaf6fee6e4195af599
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true